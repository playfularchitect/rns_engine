[build-system]
requires = [
  "setuptools>=77",
  "wheel",
  "packaging>=24.2",
  "pybind11>=3.0.0",
  "numpy==2.2.6; python_version < '3.14'",
  "numpy==2.4.5; python_version >= '3.14'",
]
build-backend = "setuptools.build_meta"

[project]
name = "rns_engine"
version = "0.11.2"
description = "Exact RNS engine with session/cache API."
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [
  { name = "Evan Wesley" }
]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.23"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = [
  "pytest",
  "tomli>=1; python_version < '3.11'",
  "numpy==2.2.6; python_version < '3.14'",
  "numpy==2.4.5; python_version >= '3.14'",
]

[project.scripts]
rns-pre-cuda = "rns_engine.pre_cuda:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["rns_engine", "rns_engine.*"]

[tool.setuptools.package-data]
rns_engine = [
  "data/*.json",
  "data/*.b64",
]

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["pp*", "*-musllinux*"]
dependency-versions = "latest"
test-extras = ["test"]
test-command = "python -m pytest {project}/tests -v"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
environment = {MACOSX_DEPLOYMENT_TARGET = "11.0"}

[tool.cibuildwheel.linux]
archs = ["x86_64"]
environment = {PIP_ONLY_BINARY = "numpy"}

[tool.cibuildwheel.windows]
archs = ["AMD64"]