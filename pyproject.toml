[build-system]
requires = ["setuptools>=77", "wheel", "packaging>=24.2", "pybind11>=2.13", "numpy==2.2.6"]
build-backend = "setuptools.build_meta"

[project]
name = "rns_engine"
version = "0.7.0"
description = "Exact RNS engine with session/cache API."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Evan Wesley" }
]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.23"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: C++",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest", "numpy==2.2.6"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["rns_engine", "rns_engine.*"]

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*"]
skip = ["pp*", "*-musllinux*"]
dependency-versions = "latest"
test-extras = ["test"]
test-command = "python -m pytest {project}/tests -v"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
environment = {MACOSX_DEPLOYMENT_TARGET = "11.0"}

[tool.cibuildwheel.linux]
archs = ["x86_64"]
environment = {PIP_ONLY_BINARY = "numpy"}

[tool.cibuildwheel.windows]
archs = ["AMD64"]
