name: Build & Publish

on:
  push:
    branches: [main, rci-integration]
  pull_request:
    branches: [main, rci-integration]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current main version to PyPI and tag it
        required: true
        default: false
        type: boolean

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install build deps
        run: python -m pip install "pybind11>=3.0.0" pytest build twine

      - name: Build in-place
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Verify installed dependencies
        run: python -m pip check

  build_wheels:
    name: Wheels (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.4.1

      - name: Pre-cache virtualenv (Mac)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/Library/Caches/cibuildwheel
          curl -L --retry 5 --retry-delay 10 \
            -H "Authorization: token $GH_TOKEN" \
            "https://raw.githubusercontent.com/pypa/get-virtualenv/20.26.6/public/virtualenv.pyz" \
            -o ~/Library/Caches/cibuildwheel/virtualenv-20.26.6.pyz
          echo "Cached: $(ls -lh ~/Library/Caches/cibuildwheel/)"

      - name: Pre-cache virtualenv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "$env:LOCALAPPDATA\pypa\cibuildwheel\Cache"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = "https://raw.githubusercontent.com/pypa/get-virtualenv/20.26.6/public/virtualenv.pyz"
          $out = "$dir\virtualenv-20.26.6.pyz"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing `
            -Headers @{Authorization="token $env:GH_TOKEN"}
          Write-Host "Cached: $(Get-Item $out | Select-Object -ExpandProperty Length) bytes"

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install build deps
        run: python -m pip install build "pybind11>=3.0.0" "numpy==2.4.5" twine

      - name: Build sdist
        run: python -m build --sdist

      - name: Check sdist metadata
        run: python -m twine check dist/*

      - name: Verify source distribution contents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile

          archives = list(Path("dist").glob("*.tar.gz"))
          if len(archives) != 1:
              raise SystemExit(f"expected one source archive, found {archives}")

          required = {
              "G4_SERIES1_EVIDENCE.md",
              "src/rns_engine/g4_public.py",
              "src/rns_engine/g4_integer_benchmark.py",
              "src/rns_engine/g4_matmul.py",
              "src/rns_engine/g4_runtime.py",
              "src/rns_engine/g4_xops.py",
              "src/rns_engine/data/g4s1_public_t4_runtime.json",
          }
          with tarfile.open(archives[0], "r:gz") as archive:
              members = set()
              for member in archive.getmembers():
                  parts = Path(member.name).parts
                  if len(parts) > 1:
                      members.add("/".join(parts[1:]))

          missing = sorted(required - members)
          if missing:
              raise SystemExit(f"source archive is missing required G4 assets: {missing}")
          print("source archive contains every required public G4 asset")
          PY

      - name: Install source distribution and verify public G4 surface
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.tar.gz
          python - <<'PY'
          import rns_engine as rns
          from rns_engine.g4_runtime import runtime_metadata

          for name in (
              "g4_results",
              "g4_benchmark",
              "g4_integer_benchmark",
              "g4_rational_benchmark",
              "g4_matmul",
          ):
              if not callable(getattr(rns, name, None)):
                  raise SystemExit(f"missing public G4 API: {name}")

          meta = runtime_metadata()
          if meta.get("hardware") != "Tesla T4":
              raise SystemExit("unexpected public G4 hardware contract")
          if meta.get("compute_capability") != "7.5":
              raise SystemExit("unexpected public G4 compute-capability contract")
          if meta.get("modes", {}).get("full") != 1024:
              raise SystemExit("unexpected public G4 full-shape count")

          print("installed source distribution exposes the certified public G4 surface")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]') ||
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    environment:
      name: pypi
      url: https://pypi.org/project/rns_engine/

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Resolve and validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(python - <<'PY'
          from pathlib import Path
          import tomllib

          with Path("pyproject.toml").open("rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          TAG="v${VERSION}"

          git fetch --tags --force
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists; refusing to republish the same version" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Tag successful release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
