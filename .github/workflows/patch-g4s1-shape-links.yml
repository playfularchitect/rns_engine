name: Patch G4S1 Shape Links

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Add direct Series 1 shape links
        shell: python
        run: |
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          old_table = '| **Shapes** | frozen set of 1,024 `(M,N,K)` GEMM shapes |'
          new_table = '| **Shapes** | frozen set of [1,024 supported `(M,N,K)` GEMM shapes](shapes/G4s1/) |'
          old_scope = '- The benchmark catalog contains the declared **1,024 GEMM shapes**, not every possible matrix size.'
          new_scope = '- The benchmark catalog contains the declared **[1,024 GEMM shapes](shapes/G4s1/)**, not every possible matrix size.'

          if text.count(old_table) != 1:
              raise SystemExit(f'expected exactly one contract-table shape row, found {text.count(old_table)}')
          if text.count(old_scope) != 1:
              raise SystemExit(f'expected exactly one scope shape sentence, found {text.count(old_scope)}')

          text = text.replace(old_table, new_table).replace(old_scope, new_scope)
          path.write_text(text, encoding='utf-8')

      - name: Commit patch and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-g4s1-shape-links.yml
          git add README.md
          git commit -m "Link the G4 Series 1 supported shapes"
          git push origin HEAD:"${GITHUB_HEAD_REF}"
